[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-praxis"
version = "0.5.0"
description = "Coordinate coding agents in Git worktrees with file claims, asset locks, checked batch landings, and a shared queue for heavy jobs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Calvin Corbett" }]
keywords = ["ai", "agents", "git", "worktree", "coordination", "game-development", "claude-code", "codex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "tomli>=1.1; python_version < \"3.11\"",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]

[project.scripts]
praxis = "agent_praxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "mixed: runs this Praxis beside a really installed older one for minutes (tests/test_mixed_versions.py); leave it out with -m \"not mixed\"",
]

[tool.ruff]
line-length = 120
target-version = "py310"
